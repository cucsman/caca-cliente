# Empacotamento do Caça-Cliente desktop.
#   npm --prefix desktop run dist -- --mac   (local)
#   CI: .github/workflows/release-desktop.yml publica nas Releases em tag v*
appId: gg.doti.caca-cliente
# ASCII no executável: cedilha no nome do binário empacotado quebra o boot no
# macOS (SIGTRAP, pânico Rust em cxxbridge1$string$drop). O nome bonito com ç
# continua na janela (main.js) e no front — só o binário/instalador é ASCII.
productName: Caca-Cliente
artifactName: CacaCliente-${version}-${os}-${arch}.${ext}

# Nenhuma dependência nativa (node:sqlite é builtin) — não recompilar nada.
npmRebuild: false
nodeGypRebuild: false

directories:
  buildResources: build

# Reassina ad-hoc o .app no macOS depois do empacotamento — sem isso o bundle
# sai com assinatura corrompida e o Gatekeeper acusa "app está danificado" em
# vez do aviso normal de app não identificado. Ver comentário em build/afterPack.cjs.
afterPack: build/afterPack.cjs

# Sem asar: arquivos reais no disco — imports ESM do server e express.static
# funcionam sem nenhum caso especial. Custo de startup é irrelevante aqui.
asar: false

files:
  - main.js
  - preload.cjs
  - package.json
  - from: ../server/src
    to: server/src
  - from: ../web/dist
    to: web/dist

win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  # Instalador clássico "avançar-avançar-concluir" — o que o aluno conhece.
  oneClick: false
  # false (não é o default — o default do electron-builder é true): com
  # perMachine:false, deixar o aluno trocar a pasta é um risco real, não só
  # estético. Se ele navegar até algo tipo "C:\Program Files\Caca-Cliente"
  # (caminho que ele já viu em outros programas), o instalador tenta escrever
  # lá SEM elevação — falha com erro de acesso negado, o aluno interpreta como
  # "preciso ser administrador" e é exatamente o sintoma relatado. Fixar o
  # destino em %LOCALAPPDATA%\Programs remove essa escolha inteira do fluxo.
  allowToChangeInstallationDirectory: false
  # Explícito (é o default do electron-builder, mas não confiar em default
  # silencioso): instala em %LOCALAPPDATA%\Programs, por usuário, SEM pedir
  # elevação UAC. O aluno não precisa (e não deve) usar "abrir como
  # administrador" — se o instalador pede elevação, é outra coisa (SmartScreen
  # ou antivírus), não falta de admin de verdade.
  perMachine: false

mac:
  target:
    - target: dmg
      arch: [arm64, x64]

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Office

publish:
  provider: github
